name: EdgeCat

options:
  bundleIdPrefix: com.edgecat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""              # fill in before signing
    ENABLE_BITCODE: NO
    # Relaxed for the WIP scaffold so first-builds on Xcode 26 don't fail on
    # Swift 6 concurrency warnings. Tighten once Phase A is stable.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    # Our LiteRT-LM dylibs are arm64-only (built from Bazel for both ios_arm64
    # and ios_sim_arm64). Skip the x86_64 simulator slice that Xcode tries to
    # build by default on Apple Silicon.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  EdgeCat:
    type: application
    platform: iOS
    sources:
      - path: EdgeCat
        excludes:
          # `skills/` is added to the bundle as a folder reference below;
          # excluding it from sources prevents Xcode from emitting duplicate
          # copy actions ("Multiple commands produce …/index.html").
          - "Resources/skills/**"
    resources:
      - EdgeCat/Resources/Assets.xcassets
      - EdgeCat/Resources/model_allowlist.json
      - EdgeCat/Resources/prompt_templates.json
      # Material Symbols Rounded — same icon set Compose uses on Android
      # via `Icons.Rounded.*`. Nunito is the body typography family that
      # Android also bundles (android-app/.../res/font/).
      - EdgeCat/Resources/Fonts/MaterialSymbolsRounded.ttf
      - EdgeCat/Resources/Fonts/nunito_regular.ttf
      - EdgeCat/Resources/Fonts/nunito_medium.ttf
      - EdgeCat/Resources/Fonts/nunito_semibold.ttf
      - EdgeCat/Resources/Fonts/nunito_bold.ttf
      - EdgeCat/Resources/Fonts/nunito_extrabold.ttf
      - EdgeCat/Resources/Fonts/nunito_light.ttf
      - EdgeCat/Resources/Fonts/nunito_extralight.ttf
      - EdgeCat/Resources/Fonts/nunito_black.ttf
    # xcodegen 2.45 silently drops `type: folder` resources, so the JS skill
    # bundle (Resources/skills/<slug>/{SKILL.md,scripts/index.html}) gets
    # copied via an explicit Run Script phase instead. Folder reference =
    # preserves directory layout (which the JS runner depends on for
    # `subdirectory:` lookups). Idempotent: rsync deletes stale paths so
    # renaming a skill in source doesn't leak into the bundle.
    postBuildScripts:
      - name: Copy JS skill bundle
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(WRAPPER_NAME)/skills
        script: |
          rsync -a --delete \
            "$SRCROOT/EdgeCat/Resources/skills/" \
            "$BUILT_PRODUCTS_DIR/$WRAPPER_NAME/skills/"
    info:
      path: EdgeCat/Resources/Info.plist
      properties:
        CFBundleDisplayName: EdgeCat
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Material Symbols Rounded + Nunito body font — copied from Android
        # to keep visual parity. CTFontManager registers each on first
        # launch; SwiftUI references them by PostScript name.
        UIAppFonts:
          - MaterialSymbolsRounded.ttf
          - nunito_regular.ttf
          - nunito_medium.ttf
          - nunito_semibold.ttf
          - nunito_bold.ttf
          - nunito_extrabold.ttf
          - nunito_light.ttf
          - nunito_extralight.ttf
          - nunito_black.ttf
        # Privacy strings — present from day one so we don't have to revisit Info.plist
        # every time we add a skill in Phase D. The strings are user-facing rationales.
        NSContactsUsageDescription: "EdgeCat uses your contacts when you ask the assistant to call or message someone."
        NSCalendarsUsageDescription: "EdgeCat reads and creates calendar events at your request."
        NSRemindersUsageDescription: "EdgeCat creates reminders at your request."
        NSPhotoLibraryUsageDescription: "EdgeCat reads photos when you ask the assistant to find or share images."
        NSLocationWhenInUseUsageDescription: "EdgeCat reads your location when the assistant needs nearby context."
        NSCameraUsageDescription: "EdgeCat uses the camera for barcode scanning and photo input to the assistant."
        NSMicrophoneUsageDescription: "EdgeCat uses the microphone for voice input to the assistant."
        NSFaceIDUsageDescription: "EdgeCat can use Face ID to protect saved conversations."
        NSHealthShareUsageDescription: "EdgeCat reads health metrics (steps, heart rate, distance, sleep, workouts) when you ask the assistant about your activity."
        # iOS rejects the read entitlement without an update string, even when we never write.
        NSHealthUpdateUsageDescription: "EdgeCat does not write to HealthKit; this entry is required by iOS only when the read entitlement is present."
        # Eval harness URL scheme — mirrors android-app/.../EvalActivity's
        # ADB intent entry point. Trigger via:
        #   xcrun simctl openurl <udid> "edgecat://eval?prompt=hi&model=gemma-4-E2B-it.litertlm"
        CFBundleURLTypes:
          - CFBundleURLName: com.edgecat.app.url
            CFBundleURLSchemes:
              - edgecat   # handles both eval ("edgecat://eval...") + HF OAuth callback ("edgecat://hf-callback")
    entitlements:
      path: EdgeCat/Resources/EdgeCat.entitlements
      properties:
        # HealthKit read access — without this, every HK query returns
        # "Missing com.apple.developer.healthkit entitlement". Verifying
        # via simulator: HK is available, samples will be empty (sim has
        # no source data) but the query succeeds.
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edgecat.app
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIRequiresFullScreen: NO
    dependencies:
      - target: LiteRtLmBridge
        embed: true
        codeSign: true
      # XCFrameworks bundle device (ios_arm64) + simulator (ios_sim_arm64)
      # slices in one artifact so the right dylib is picked automatically
      # depending on the build SDK. embed=true copies the resolved slice to
      # EdgeCat.app/Frameworks/. link=false here because the bridge
      # framework already links them at build time.
      - framework: LiteRtLmBridge/Vendor/LiteRtLm.xcframework
        embed: true
        codeSign: true
        link: false
      - framework: LiteRtLmBridge/Vendor/GemmaModelConstraintProvider.xcframework
        embed: true
        codeSign: true
        link: false
      # Metal accelerator — loaded at runtime by libLiteRtLm.dylib via
      # dlopen("libLiteRtMetalAccelerator.dylib") when the engine is
      # asked for backend=gpu. embed=true copies the resolved slice to
      # EdgeCat.app/Frameworks/, where dyld's @rpath search finds it.
      # link=false because we don't reference its symbols at build time.
      - framework: LiteRtLmBridge/Vendor/LiteRtLmMetalAccelerator.xcframework
        embed: true
        codeSign: true
        link: false

  EdgeCatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EdgeCatTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edgecat.app.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EdgeCat.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/EdgeCat"
        SWIFT_VERSION: "5.10"
    dependencies:
      - target: EdgeCat

  LiteRtLmBridge:
    type: framework
    platform: iOS
    sources:
      - path: LiteRtLmBridge
        excludes:
          - "Vendor/**"           # vendored dylibs are linked, not compiled in
          - "include/**"          # public headers are added with explicit visibility below
          - "module.modulemap"
      - path: LiteRtLmBridge/include
        headerVisibility: public
    settings:
      base:
        DEFINES_MODULE: YES
        CLANG_ENABLE_MODULES: YES
        GENERATE_INFOPLIST_FILE: YES
        MODULEMAP_FILE: $(SRCROOT)/LiteRtLmBridge/module.modulemap
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/LiteRtLmBridge/include
          - $(SRCROOT)/LiteRtLmBridge/Vendor/litert_lm
        # Public header so the app target can `import LiteRtLmBridge`.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/LiteRtLmBridge/include
        PRODUCT_BUNDLE_IDENTIFIER: com.edgecat.litertlmbridge
    dependencies:
      # The bridge target links the LiteRT-LM xcframework at build time so the
      # .mm file's calls to litert_lm_engine_* resolve. The app target embeds
      # the xcframework so dyld can find the slice at runtime.
      - framework: LiteRtLmBridge/Vendor/LiteRtLm.xcframework
        embed: false
      - framework: LiteRtLmBridge/Vendor/GemmaModelConstraintProvider.xcframework
        embed: false

schemes:
  EdgeCat:
    build:
      targets:
        EdgeCat: all
        LiteRtLmBridge: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EdgeCatTests
      gatherCoverageData: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
